name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Maintains a release PR that bumps `version` in Cargo.toml and Cargo.lock
      # and writes CHANGELOG.md. Merging that PR creates the tag and the release.
      #
      # include-component-in-tag is false in the config so tags are bare
      # `vX.Y.Z`, matching the rest of the Paubox SDK fleet.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name }} to crates.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for crates.io Trusted Publishing (OIDC)
    steps:
      # This job has to live in this workflow rather than in one triggered by
      # `push: tags`. release-please creates the tag with GITHUB_TOKEN, and
      # GitHub does not start workflow runs from GITHUB_TOKEN-created events, so
      # a tag-triggered publish would never fire. Gating on `release_created`
      # is how paubox-go and paubox-cli solve the same problem.
      #
      # Because the run's ref is refs/heads/main, the `release` environment must
      # allow `main` as a deployment branch, and the crates.io trusted publisher
      # is registered against this filename:
      #   owner: Paubox  repo: paubox-rust
      #   workflow: release-please.yml  environment: release
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the crate before publishing
        run: |
          cargo fmt --all --check
          cargo test --all-features
          cargo publish --dry-run

      - name: Mint a short-lived crates.io token (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
