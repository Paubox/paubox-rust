name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # -----------------------------------------------------------------------
  # Format
  # -----------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # -----------------------------------------------------------------------
  # Clippy
  # -----------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # -----------------------------------------------------------------------
  # Tests
  # -----------------------------------------------------------------------
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["stable", "beta"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # -----------------------------------------------------------------------
  # Minimum Supported Rust Version
  # -----------------------------------------------------------------------
  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  # -----------------------------------------------------------------------
  # Feature-flag matrix
  # -----------------------------------------------------------------------
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests, examples, and doctest gating are covered too:
      # a lib-only check passes even when no example under the active feature
      # set compiles.
      - run: cargo test --all-targets
      - run: cargo test --no-default-features --features email --all-targets
      - run: cargo test --no-default-features --features forms --all-targets
      # Doctests are not built by --all-targets, so run them per feature set.
      - run: cargo test --no-default-features --features email --doc
      - run: cargo test --no-default-features --features forms --doc
      # At least one feature is required; a bare --no-default-features build
      # is intentionally rejected by a compile_error in src/lib.rs.

  # -----------------------------------------------------------------------
  # Documentation (catches broken intra-doc links)
  # -----------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
